<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org;">
  <meta name="referrer" content="no-referrer">
  <title>Реклама</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      text-align: center;
    }
    .ad-banner {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border-radius: 16px;
      padding: 30px 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 20px rgba(0,128,0,0.3);
    }
    .ad-banner h1 { font-size: 22px; margin-bottom: 10px; }
    .ad-banner p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
    .ad-btn {
      display: inline-block;
      background: white;
      color: #2E7D32;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .ad-btn:active { transform: scale(0.95); }

    .custom-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: #2196F3;
      box-shadow: 0 4px 10px rgba(33,150,243,0.3);
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .custom-btn:active { transform: scale(0.97); }
    .btn-green { background: #4CAF50; box-shadow: 0 4px 10px rgba(76,175,80,0.3); }
    .btn-purple { background: #9C27B0; box-shadow: 0 4px 10px rgba(156,39,176,0.3); }
    .btn-orange { background: #FF9800; box-shadow: 0 4px 10px rgba(255,152,0,0.3); }
  </style>
</head>
<body>
  <div class="ad-banner">
    <h1>🎉 Специальное предложение</h1>
    <p>Скидка 20% на все товары по промокоду <strong>TELEBOT</strong></p>
    <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="ad-btn">Перейти на сайт</a>
  </div>

  <button class="custom-btn" id="btn-start">🟢 Старт</button>
  <button class="custom-btn btn-green" id="btn-info">ℹ️ Информация</button>
  <button class="custom-btn btn-purple" id="btn-support">🛠 Поддержка</button>
  <!-- Кнопка для предложения рекламы (видна всем) -->
  <button class="custom-btn btn-orange" id="btn-advertise">📢 Предложить рекламу</button>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();

        // Validate that the app is opened from a legitimate Telegram context
        if (!Telegram.WebApp.initData || Telegram.WebApp.initData.length === 0) {
          document.body.textContent = 'Ошибка: приложение должно быть открыто из Telegram.';
          return;
        }

        if (Telegram.WebApp.colorScheme === 'dark') {
          document.documentElement.style.setProperty('--tg-theme-bg-color', '#1e1e1e');
          document.documentElement.style.setProperty('--tg-theme-text-color', '#ffffff');
        }

        document.getElementById('btn-start').addEventListener('click', () => {
          Telegram.WebApp.sendData(JSON.stringify({ action: 'start' }));
          Telegram.WebApp.close();
        });
        document.getElementById('btn-info').addEventListener('click', () => {
          Telegram.WebApp.sendData(JSON.stringify({ action: 'info' }));
          Telegram.WebApp.close();
        });
        document.getElementById('btn-support').addEventListener('click', () => {
          Telegram.WebApp.sendData(JSON.stringify({ action: 'support' }));
          Telegram.WebApp.close();
        });
        document.getElementById('btn-advertise').addEventListener('click', () => {
          // Открываем страницу с формой предложения рекламы
          window.location.href = 'advertise.html';
        });
      } else {
        document.body.textContent = 'Ошибка загрузки WebApp. Обновите Telegram.';
      }
    });
  </script>
</body>
</html>
