<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Предложить рекламу</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    .form-group { margin-bottom: 20px; }
    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      background: transparent;
      color: inherit;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #4CAF50; }
    textarea::placeholder {
      color: #aaa;
      font-style: italic;
    }
    .char-count {
      text-align: right;
      font-size: 14px;
      color: #aaa;
      margin-top: 5px;
    }
    .file-label {
      display: block;
      padding: 12px;
      border: 2px dashed #4CAF50;
      border-radius: 12px;
      text-align: center;
      color: #4CAF50;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .file-label:hover { background: rgba(76,175,80,0.1); }
    input[type="file"] { display: none; }
    #preview {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2 style="margin-bottom: 20px;">📢 Предложить рекламу</h2>

  <div class="form-group">
    <textarea id="ad-text" placeholder="Введите текст" maxlength="450"></textarea>
    <div class="char-count"><span id="char-count">0</span>/450</div>
  </div>

  <label class="file-label" for="photo-input">📷 Прикрепить фото</label>
  <input type="file" id="photo-input" accept="image/*">
  <img id="preview" alt="Превью">

  <button class="submit-btn" id="submit-btn">Отправить</button>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (!window.Telegram || !Telegram.WebApp) {
        document.body.innerHTML = '<p style="color:red;">Ошибка. Обновите Telegram.</p>';
        return;
      }
      Telegram.WebApp.ready();

      const textarea = document.getElementById('ad-text');
      const charCount = document.getElementById('char-count');
      const photoInput = document.getElementById('photo-input');
      const preview = document.getElementById('preview');
      const submitBtn = document.getElementById('submit-btn');

      // Счётчик символов
      textarea.addEventListener('input', () => {
        charCount.textContent = textarea.value.length;
      });

      // Превью фото
      photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            preview.src = ev.target.result;
            preview.style.display = 'block';
          };
          reader.readAsDataURL(file);
        }
      });

      // Отправка
      submitBtn.addEventListener('click', () => {
        const text = textarea.value.trim();
        if (!text) {
          Telegram.WebApp.showAlert('Пожалуйста, введите текст.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';

        const data = {
          action: 'advertise',
          text: text,
          photo: null
        };

        const file = photoInput.files[0];
        if (file) {
          // Сжимаем фото до 100x100 и конвертируем в base64
          const reader = new FileReader();
          reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
              const canvas = document.createElement('canvas');
              const ctx = canvas.getContext('2d');
              canvas.width = 100;
              canvas.height = 100;
              ctx.drawImage(img, 0, 0, 100, 100);
              data.photo = canvas.toDataURL('image/jpeg', 0.7).split(',')[1]; // только base64-строка
              sendData(data);
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        } else {
          sendData(data);
        }
      });

      function sendData(data) {
        Telegram.WebApp.sendData(JSON.stringify(data));
        Telegram.WebApp.close();
      }
    });
  </script>
</body>
</html>
