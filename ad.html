<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Реклама</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      text-align: center;
    }
    .ad-banner {
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      color: white;
      border-radius: 16px;
      padding: 30px 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 20px rgba(0,128,0,0.3);
    }
    .ad-banner h1 { font-size: 22px; margin-bottom: 10px; }
    .ad-banner p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
    .ad-btn {
      display: inline-block;
      background: white;
      color: #2E7D32;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .ad-btn:active { transform: scale(0.95); }

    .custom-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: #2196F3;
      box-shadow: 0 4px 10px rgba(33,150,243,0.3);
      transition: transform 0.1s, opacity 0.2s;
    }
    .custom-btn:active { transform: scale(0.97); }
    .btn-green { background: #4CAF50; box-shadow: 0 4px 10px rgba(76,175,80,0.3); }
    .btn-purple { background: #9C27B0; box-shadow: 0 4px 10px rgba(156,39,176,0.3); }
  </style>
</head>
<body>
  <div class="ad-banner">
    <h1>🎉 Специальное предложение</h1>
    <p>Скидка 20% на все товары по промокоду <strong>TELEBOT</strong></p>
    <a href="https://example.com" target="_blank" class="ad-btn">Перейти на сайт</a>
  </div>

  <button class="custom-btn" onclick="sendData('start')">🟢 Старт</button>
  <button class="custom-btn btn-green" onclick="sendData('info')">ℹ️ Информация</button>
  <button class="custom-btn btn-purple" onclick="sendData('support')">🛠 Поддержка</button>

  <script>
    Telegram.WebApp.ready();

    function sendData(action) {
      Telegram.WebApp.sendData(JSON.stringify({ action: action }));
      Telegram.WebApp.close();
    }

    // Адаптация цветов под тему Telegram
    const root = document.documentElement;
    if (window.Telegram.WebApp.colorScheme === 'dark') {
      root.style.setProperty('--tg-theme-bg-color', '#1e1e1e');
      root.style.setProperty('--tg-theme-text-color', '#ffffff');
    }
  </script>
</body>
</html>
